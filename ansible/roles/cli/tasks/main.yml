---
# Installs the `site` CLI. Everything is root-owned and not writable by
# anyone else: the CLI runs as root, so its code must be as protected as the
# system itself.
#
# Upgrade path (docs/upgrade.md): each release gets its own directory
# /usr/lib/ozenix/releases/<version>, and /usr/lib/ozenix/current
# is switched to it with one atomic symlink replacement. Old and new modules
# never mix, and the previous release stays on disk for diagnosis.

- name: Package directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/lib/ozenix
    - /usr/lib/ozenix/releases
    - "/usr/lib/ozenix/releases/{{ dp_version }}"

- name: Install the ozenix Python package
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../ozenix/"
    dest: "/usr/lib/ozenix/releases/{{ dp_version }}/ozenix/"
    owner: root
    group: root
    mode: "u=rwX,go=rX"
    directory_mode: "0755"

- name: Remove bytecode copied from a development tree
  ansible.builtin.find:
    paths: "/usr/lib/ozenix/releases/{{ dp_version }}/ozenix"
    patterns: __pycache__
    file_type: directory
    recurse: true
  register: cli_pycache
  changed_when: false

- name: Delete stray bytecode directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ cli_pycache.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Verify the new release imports before switching to it
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -IB
      - -c
      - "import sys; sys.path.insert(0, sys.argv[1]); import ozenix.cli.main, ozenix.release; print(ozenix.__version__)"
      - "/usr/lib/ozenix/releases/{{ dp_version }}"
  register: cli_import
  changed_when: false
  failed_when: cli_import.rc != 0 or cli_import.stdout != dp_version

- name: Switch to this release (atomic symlink replacement)
  ansible.builtin.file:
    src: "releases/{{ dp_version }}"
    dest: /usr/lib/ozenix/current
    state: link
    force: true
    owner: root
    group: root

- name: Install the site command
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bin/site"
    dest: /usr/local/bin/site
    owner: root
    group: root
    mode: "0755"

- name: Remove the pre-0.10 package location
  ansible.builtin.file:
    path: /usr/lib/ozenix/ozenix
    state: absent

- name: List installed releases
  ansible.builtin.find:
    paths: /usr/lib/ozenix/releases
    file_type: directory
  register: cli_releases
  changed_when: false

- name: Keep the current and two previous releases
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (cli_releases.files | sort(attribute='mtime', reverse=true))[3:] }}"
  when: item.path | basename != dp_version
  loop_control:
    label: "{{ item.path }}"

- name: Verify the CLI starts
  ansible.builtin.command: /usr/local/bin/site version
  changed_when: false

# Audit log (threat TH19): append-only. Existing entries cannot be changed or
# truncated without first removing the flag, which `site system audit` reports
# (AUDIT-APPEND-ONLY). No logrotate for this file: it grows slowly (one line
# per privileged operation).
- name: Log directory for ozenix
  ansible.builtin.file:
    path: /var/log/ozenix
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Audit log file exists
  ansible.builtin.file:
    path: /var/log/ozenix/audit.jsonl
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Read audit log attributes
  ansible.builtin.command: /usr/bin/lsattr -d /var/log/ozenix/audit.jsonl
  register: cli_audit_attrs
  changed_when: false
  tags: [host-kernel]

- name: Make the audit log append-only
  ansible.builtin.command: /usr/bin/chattr +a /var/log/ozenix/audit.jsonl
  when: "'a' not in cli_audit_attrs.stdout.split()[0]"
  changed_when: true
  tags: [host-kernel]

# Welcome screen at SSH login (Ubuntu's update-motd). Ubuntu's own help text
# and news are switched off so the login shows ozenix's information instead.
- name: Welcome screen (ozenix)
  ansible.builtin.template:
    src: ozenix-motd.sh.j2
    dest: /etc/update-motd.d/05-ozenix
    owner: root
    group: root
    mode: "0755"
  when: dp_motd_enabled | bool

- name: Remove the welcome screen when disabled
  ansible.builtin.file:
    path: /etc/update-motd.d/05-ozenix
    state: absent
  when: not dp_motd_enabled | bool

- name: Find Ubuntu's help-text and news login messages
  ansible.builtin.stat:
    path: "/etc/update-motd.d/{{ item }}"
  loop: [10-help-text, 50-motd-news]
  register: cli_motd_parts

- name: Turn off Ubuntu's help-text and news login messages
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    mode: "0644"
  loop: "{{ cli_motd_parts.results | selectattr('stat.exists') | list }}"
  when: dp_motd_enabled | bool
  loop_control:
    label: "{{ item.item }}"

# After an upgrade, bring every existing site up to the new release's
# templates (nginx, sandbox units, AppArmor profiles, site-user limits).
# Only differing files are rewritten, so a second run changes nothing.
- name: Re-apply every site's configuration
  ansible.builtin.command: /usr/local/bin/site --json system refresh
  register: cli_refresh
  changed_when: (cli_refresh.stdout | from_json).result.changed | length > 0
  failed_when: cli_refresh.rc not in [0]
  when: not ansible_check_mode
