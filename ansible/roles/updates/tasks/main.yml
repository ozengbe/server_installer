---
- name: Install update tooling
  ansible.builtin.apt:
    name: [unattended-upgrades, needrestart]
    state: present

- name: Daily package list refresh and unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by DomainPilot
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

# The Ubuntu default (50unattended-upgrades) already limits origins to the
# -security pocket and ESM. These settings add policy on top; the audit
# (Phase 9) flags any -updates/-proposed/-backports origin added by hand.
- name: Unattended-upgrades policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52domainpilot-unattended
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by DomainPilot. Never reboot production servers automatically.
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "false";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::SyslogEnable "true";
      Unattended-Upgrade::OnlyOnACPower "false";
      Dpkg::Options { "--force-confdef"; "--force-confold"; };

# Restart services that use patched libraries, except stateful ones.
- name: Configure needrestart policy
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/90-domainpilot.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by DomainPilot
      $nrconf{restart} = 'a';
      # Never restart the database automatically; reported for a maintenance window instead.
      $nrconf{override_rc}{qr(^mariadb)} = 0;
      $nrconf{override_rc}{qr(^mysql)} = 0;
      $nrconf{override_rc}{qr(^dp-redis@)} = 0;

- name: Install health check
  ansible.builtin.copy:
    src: dp-healthcheck
    dest: /usr/local/sbin/dp-healthcheck
    owner: root
    group: root
    mode: "0750"

- name: Maintenance window and post-update health check
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [apt-daily-upgrade.timer.d, apt-daily-upgrade.service.d]

- name: Upgrade timer runs in the maintenance window
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/90-domainpilot.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by DomainPilot
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* {{ dp_updates_window_start }}
      RandomizedDelaySec={{ dp_updates_window_jitter }}
      Persistent=true
  register: updates_timer

- name: Run the health check after every unattended upgrade
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.service.d/90-domainpilot.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by DomainPilot. "-" prefix: a failing check is logged/alerted, not fatal.
      [Service]
      ExecStartPost=-/usr/local/sbin/dp-healthcheck --post-update
  register: updates_service

- name: Reload systemd and restart the upgrade timer
  ansible.builtin.systemd_service:
    name: apt-daily-upgrade.timer
    state: restarted
    enabled: true
    daemon_reload: true
  when: updates_timer is changed or updates_service is changed  # noqa: no-handler
