---
# --- Signed nginx.org repository (key vendored in this repo, fingerprints pinned) ---
- name: Install gpg for key fingerprint verification (absent on minimal images)
  ansible.builtin.apt:
    name: gpg
    state: present

- name: Install vendored nginx.org signing key
  ansible.builtin.copy:
    src: nginx-signing-key.asc
    dest: /usr/share/keyrings/nginx-archive-keyring.asc
    owner: root
    group: root
    mode: "0644"

- name: Read key fingerprints
  ansible.builtin.command: /usr/bin/gpg --show-keys --with-colons /usr/share/keyrings/nginx-archive-keyring.asc
  register: nginx_key_info
  changed_when: false

- name: Key file contains only the pinned nginx.org keys
  ansible.builtin.assert:
    that:
      - nginx_key_fprs | length > 0
      - nginx_key_fprs | difference(nginx_pinned_fingerprints) | length == 0
    fail_msg: "Unexpected key(s) in nginx keyring: {{ nginx_key_fprs | difference(nginx_pinned_fingerprints) }}"
  vars:
    nginx_key_fprs: >-
      {{ nginx_key_info.stdout_lines | select('match', '^fpr:') | map('split', ':')
         | map(attribute=9) | list }}

- name: Add the nginx.org stable repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nginx.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by DomainPilot
      Types: deb
      URIs: https://nginx.org/packages/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: nginx
      Signed-By: /usr/share/keyrings/nginx-archive-keyring.asc
  register: nginx_repo

- name: Prefer nginx.org packages for nginx only
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-domainpilot-nginx
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by DomainPilot
      Package: *
      Pin: origin nginx.org
      Pin-Priority: 900

- name: Install nginx (nginx.org stable)
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: "{{ nginx_repo is changed }}"

- name: Verify nginx came from nginx.org
  ansible.builtin.command: /usr/bin/dpkg-query -W -f=${Maintainer} nginx
  register: nginx_maint
  changed_when: false
  failed_when: "'nginx' not in nginx_maint.stdout | lower or 'ubuntu' in nginx_maint.stdout | lower"

# --- Configuration (validated; restored on failure) ---
- name: DomainPilot nginx directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/systemd/system/nginx.service.d
    - /etc/nginx/domainpilot
    - /etc/nginx/domainpilot/snippets
    - /etc/nginx/domainpilot/sites
    - /etc/nginx/domainpilot/default-tls

- name: Self-signed placeholder cert for the default server (never presented; handshake rejected)
  ansible.builtin.command: >-
    /usr/bin/openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
    -days 3650 -subj /CN=invalid
    -keyout /etc/nginx/domainpilot/default-tls/key.pem
    -out /etc/nginx/domainpilot/default-tls/cert.pem
  args:
    creates: /etc/nginx/domainpilot/default-tls/cert.pem

- name: Protect placeholder key
  ansible.builtin.file:
    path: /etc/nginx/domainpilot/default-tls/key.pem
    owner: root
    group: root
    mode: "0600"

- name: Apply nginx configuration with validation and restore on failure
  block:
    - name: Render nginx configuration
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ nginx_config_files }}"
      register: nginx_rendered
      notify: Reload nginx

    - name: Remove the package's default site
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: Reload nginx

    - name: Validate complete nginx configuration
      ansible.builtin.command: /usr/sbin/nginx -t -q
      changed_when: false

  rescue:
    - name: Restore previous nginx files
      ansible.builtin.copy:
        src: "{{ item.backup_file }}"
        dest: "{{ item.item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ nginx_rendered.results | default([]) | selectattr('backup_file', 'defined') | list }}"
      loop_control:
        label: "{{ item.item.dest }}"

    - name: Remove nginx files that had no predecessor
      ansible.builtin.file:
        path: "{{ item.item.dest }}"
        state: absent
      loop: "{{ nginx_rendered.results | default([]) | selectattr('changed') | rejectattr('backup_file', 'defined') | list }}"
      loop_control:
        label: "{{ item.item.dest }}"

    - name: Stop after nginx validation failure
      ansible.builtin.fail:
        msg: "nginx configuration failed validation; previous files restored, nginx not reloaded."

- name: Install systemd hardening for nginx
  ansible.builtin.copy:
    src: nginx-hardening.conf
    dest: /etc/systemd/system/nginx.service.d/90-domainpilot.conf
    owner: root
    group: root
    mode: "0644"
  register: nginx_unit_dropin
  notify: Restart nginx

- name: Enable nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
    daemon_reload: "{{ nginx_unit_dropin is changed }}"
