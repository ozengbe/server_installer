---
# AutoSSL: certbot from the Ubuntu archive (signed, security-maintained).
# Renewal runs from certbot's own systemd timer; the deploy hook below reloads
# nginx only after `nginx -t` succeeds.

- name: Install certbot and its Cloudflare DNS plugin
  ansible.builtin.apt:
    name: [certbot, python3-certbot-dns-cloudflare]
    state: present

- name: ACME HTTP-01 webroot (challenge tokens are public by design)
  ansible.builtin.file:
    path: /var/lib/domainpilot-acme
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Renewal deploy hook directory
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Reload nginx after a renewal, only if its configuration is valid
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/50-domainpilot-nginx
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by DomainPilot. Runs after certbot renewed a certificate.
      set -eu
      if /usr/sbin/nginx -t -q; then
          /usr/bin/systemctl reload nginx
      else
          logger -t domainpilot-acme -p user.err "renewed certificate NOT deployed: nginx -t failed"
          exit 1
      fi

- name: Automatic renewal timer
  ansible.builtin.systemd_service:
    name: certbot.timer
    enabled: true
    state: started

# DNS-01 renewals through Cloudflare: certbot's renewal config points at
# /run/domainpilot/cloudflare/<label>.ini. These hooks create those files from
# the encrypted store right before a renewal and wipe them right after, so the
# plaintext token only ever exists in RAM, and only while certbot runs.
- name: Renewal pre/post hook directories
  ansible.builtin.file:
    path: "/etc/letsencrypt/renewal-hooks/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [pre, post]

- name: Decrypt Cloudflare tokens into RAM before a renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/pre/10-domainpilot-cloudflare
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by DomainPilot.
      set -eu
      umask 077
      dir=/run/domainpilot/cloudflare
      mkdir -p "$dir" && chmod 0700 "$dir"
      for cred in /etc/domainpilot/secrets/cloudflare/*.cred; do
          [ -e "$cred" ] || continue
          label=$(basename "$cred" .cred)
          token=$(systemd-creds decrypt --name="cloudflare-$label" "$cred" -)
          printf 'dns_cloudflare_api_token = %s\n' "$token" > "$dir/$label.ini"
      done

- name: Wipe them again after the renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/post/90-domainpilot-cloudflare
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by DomainPilot.
      for f in /run/domainpilot/cloudflare/*.ini; do
          [ -e "$f" ] || continue
          shred -u "$f" 2>/dev/null || rm -f "$f"
      done
