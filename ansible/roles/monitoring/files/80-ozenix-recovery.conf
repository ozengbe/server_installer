# Managed by ozenix (role monitoring). Bounded self-healing: restart after
# a crash, at most 5 times in 10 minutes, then stay failed and alert
# (dp-alert@). Each automatic restart is also reported by `site system monitor`.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5
OnFailure=dp-alert@%n.service

[Service]
Restart=on-failure
RestartSec=5s
