---
# Host-side pieces of tenant isolation. Per-tenant objects (users, slices,
# drop-ins, AppArmor profiles) are created by the `site` CLI.

- name: Tenant directory roots
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    # 0711: traversable (nginx, own tenant) but not listable.
    - { path: /srv/tenants, mode: "0711" }
    - { path: /run/ozenix, mode: "0711" }
    - { path: /etc/ozenix/tenants, mode: "0700" }
    - { path: /var/log/ozenix/tenants, mode: "0711" }
    - { path: /var/lib/ozenix/cache, mode: "0711" }
    - { path: /etc/apparmor.d/ozenix, mode: "0755" }

- name: Keep /run/ozenix across reboots with the right mode
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/ozenix.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ozenix
      d /run/ozenix 0711 root root -

- name: Parent slice for all tenants
  ansible.builtin.copy:
    dest: /etc/systemd/system/dptenants.slice
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ozenix: all tenant workloads live below this slice.
      [Unit]
      Description=ozenix tenants
      Before=slices.target

      [Slice]
      MemoryAccounting=yes
      TasksAccounting=yes
      IOAccounting=yes
  notify: Reload systemd

- name: Tenant sandbox unit templates
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dp-php@.service
    - dp-cache@.service
    - dp-app@.service
    - dp-laravel-schedule@.service
    - dp-laravel-schedule@.timer
    - dp-laravel-queue@.service
  notify: Reload systemd

- name: Host facts for the site CLI
  ansible.builtin.template:
    src: host.toml.j2
    dest: /etc/ozenix/host.toml
    owner: root
    group: root
    mode: "0644"
