---
# DomainPilot defaults. Override per host in /etc/domainpilot/install.yml
# (generated by installer/install.sh) or in your inventory.

# Administrators: SSH key login + sudo. MUST include the account running the
# installer, or preflight refuses to continue (anti-lockout).
#   dp_admins:
#     - name: alice
#       ssh_keys:
#         - "ssh-ed25519 AAAA... alice@laptop"
dp_admins: []

# Admin accounts to revoke (key file removed, dropped from dp-admins).
# Accounts are not deleted.
dp_admins_revoked: []

# true: admins sudo without a password (they have key-only accounts).
# false: you must set a password for every admin first. Audit flags true as a warning.
dp_admin_sudo_nopasswd: true

# "no" or "local". Lets admins tunnel to private services (e.g. Grafana).
dp_admin_tcp_forwarding: "no"

# Source allowlists for SSH (CIDR strings). Both empty = SSH open to all
# (protected by key-only auth + fail2ban in 2b). If only one is set, SSH over
# the other IP family is denied.
dp_ssh_allow_v4: []
dp_ssh_allow_v6: []

# Public ports. UDP 443 (HTTP/3) is added when nginx QUIC is enabled (2b).
dp_firewall_public_tcp: [80, 443]
dp_firewall_public_udp: []

# WireGuard listen port, 0 = disabled.
dp_wireguard_port: 0

# How firewall changes are confirmed (anti-lockout):
#   manual    - change applied, rollback armed; admin confirms with
#               `sudo dp-firewall confirm` from a NEW ssh session (default)
#   remote    - Ansible reconnects over a fresh SSH session and confirms if it works
#   immediate - confirm without testing. ONLY for disposable test VMs / CI.
dp_firewall_confirm_mode: manual
dp_firewall_confirm_timeout: 120

# Reverse-path filtering: 1 strict (default), 2 loose (multi-homed hosts).
dp_rp_filter: 1

# /tmp as tmpfs with nodev,nosuid,noexec (takes effect at next boot).
dp_harden_tmp: true

# Allow running without the operator in dp_admins. Only for automation that
# connects as a separate account you manage elsewhere.
dp_i_understand_lockout_risk: false
