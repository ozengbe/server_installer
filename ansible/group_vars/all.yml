---
# ozenix defaults. Override per host in /etc/ozenix/install.yml
# (generated by installer/install.sh) or in your inventory.

# Optional extra administrators (SSH key + sudo), managed by the installer.
# Empty (the default): ozenix leaves server logins (root, your own accounts)
# exactly as they are, like CloudPanel. Sites get their own users instead.
#   dp_admins:
#     - name: alice
#       ssh_keys:
#         - "ssh-ed25519 AAAA... alice@laptop"
dp_admins: []

# Admin accounts to revoke (key file removed, dropped from dp-admins).
# Accounts are not deleted.
dp_admins_revoked: []

# true: admins sudo without a password (they have key-only accounts).
# false: you must set a password for every admin first. Audit flags true as a warning.
dp_admin_sudo_nopasswd: true

# "no" or "local". Lets admins tunnel to private services (e.g. Grafana).
dp_admin_tcp_forwarding: "no"

# Source allowlists for SSH (CIDR strings). Both empty = SSH open to all
# (protected by key-only auth + fail2ban in 2b). If only one is set, SSH over
# the other IP family is denied.
dp_ssh_allow_v4: []
dp_ssh_allow_v6: []

# Public ports. UDP 443 is opened automatically when HTTP/3 is enabled.
dp_firewall_public_tcp: [80, 443]
dp_firewall_public_udp: "{{ [443] if dp_nginx_http3 | bool else [] }}"

# Origin lock: only Cloudflare may connect to ports 80/443 (IPv4 and IPv6).
# Enable ONLY when every site on this server is proxied through Cloudflare:
# direct visitors and HTTP-01 certificate validation are blocked.
dp_cloudflare_origin_lock: false

# WireGuard listen port, 0 = disabled.
dp_wireguard_port: 0

# How firewall changes are confirmed (anti-lockout):
#   manual    - change applied, rollback armed; admin confirms with
#               `sudo dp-firewall confirm` from a NEW ssh session (default)
#   remote    - Ansible reconnects over a fresh SSH session and confirms if it works
#   immediate - confirm without testing. ONLY for disposable test VMs / CI.
dp_firewall_confirm_mode: manual
dp_firewall_confirm_timeout: 120

# Reverse-path filtering: 1 strict (default), 2 loose (multi-homed hosts).
dp_rp_filter: 1

# /tmp as tmpfs with nodev,nosuid,noexec (takes effect at next boot).
dp_harden_tmp: true

# Addresses (IPs or CIDRs) fail2ban never bans. The installer adds the IP
# you ran it from on first run; remove it if your IP is dynamic or shared.
dp_fail2ban_ignoreip: []

# --- Services (Phase 2b). Sizes are conservative; Phase 7 tunes them. ---
dp_nginx_http3: false
dp_nginx_worker_connections: 4096
dp_nginx_client_max_body_size: 64m
dp_nginx_rate_limit: 20r/s
dp_nginx_conn_per_ip: 100

# --- ozenix release being installed: read from the package itself, so the
# installed code and the recorded version can never disagree. ---
dp_version: >-
  {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../ozenix/__init__.py')
      | regex_search('__version__ = "[0-9a-z.]+"')).split('"')[1] }}

# --- Supported Ubuntu releases and their defaults (all from the Ubuntu archive,
# so they get Canonical security updates for the life of the release). ---
dp_supported_releases: ["24.04", "26.04"]
dp_release: "{{ ansible_facts['distribution_version'] }}"
dp_release_defaults:
  "24.04":
    php_version: "8.3"
    php_extensions: [mysql, sqlite3, curl, gd, intl, mbstring, xml, zip, bcmath, opcache, readline]
    # Valkey is not in the 24.04 archive; Redis 7.0 is (universe).
    cache_engine: redis
    ssh_kex: sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
  "26.04":
    php_version: "8.5"
    # OPcache is built into PHP 8.5 (no separate package).
    php_extensions: [mysql, sqlite3, curl, gd, intl, mbstring, xml, zip, bcmath, readline]
    # Valkey 9 is in main (Canonical-supported, BSD); Redis 8 is universe/AGPL.
    cache_engine: valkey
    # OpenSSH 10: ML-KEM hybrid post-quantum key exchange first.
    ssh_kex: >-
      mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org

# PHP version new sites get by default (any of dp_php_versions).
dp_php_version: "{{ dp_release_defaults[dp_release].php_version }}"
# The version the Ubuntu archive itself ships for this release.
dp_php_archive_version: "{{ dp_release_defaults[dp_release].php_version }}"
# PHP versions installed side by side; each site picks one. All but the archive
# version come from ppa:ondrej/php (pinned key), when it supports this release.
dp_php_versions: ["8.2", "8.3", "8.4", "8.5"]
# false: only the archive version (no third-party repository).
dp_php_extra_versions: true
dp_php_extensions: "{{ dp_release_defaults[dp_release].php_extensions }}"

# Node.js majors installed side by side for Node.js sites (official signed
# builds, newest release of each major; empty = no Node.js). New sites get
# dp_node_default unless `site create --node N` says otherwise.
dp_node_versions: ["22", "24", "26"]
dp_node_default: "24"
# Python sites use the Ubuntu release's python3 with a venv per site.
dp_python_sites: true
# redis | valkey. Per-site instances are unix-socket only (Phase 4).
dp_cache_engine: "{{ dp_release_defaults[dp_release].cache_engine }}"
dp_ssh_kex: "{{ dp_release_defaults[dp_release].ssh_kex }}"

dp_mariadb_max_connections: 150
dp_mariadb_innodb_buffer_pool_size: 256M
# Ceiling for live buffer-pool growth by `site system optimize` (MariaDB 11.8+
# fixes innodb_buffer_pool_size_max at startup; only address space is reserved,
# not memory). Percent of RAM; the largest profile uses 30%.
dp_mariadb_buffer_pool_max_pct: 50

# Phase 8: nightly backups (local time; +- 30 min jitter) once a target is set
# with `site system backup setup`. The weekly restore drill runs Sunday 05:00.
dp_backup_time: "02:30"
# Prometheus node exporter, bound to loopback only (scrape over WireGuard/SSH).
dp_monitoring_node_exporter: true
# Services that restart themselves after a crash (bounded) and alert when they
# finally give up. Tenant units (dp-php@, dp-cache@) have this built in.
dp_monitoring_recovery_units: [nginx, mariadb, fail2ban]

# Unattended security upgrades: daily maintenance window (local time).
# Never reboots; reboot-required is reported by dp-healthcheck.
dp_updates_window_start: "04:00"
dp_updates_window_jitter: 30m


# --- Welcome screen at SSH login ---
dp_motd_enabled: true
dp_motd_docs_url: https://ozenix.org
# Shown as "buy me a coffee" in the welcome screen; empty = line hidden.
dp_motd_coffee_url: ""
