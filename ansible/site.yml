---
# DomainPilot host baseline.
# Phase 2a: preflight, base, sysctl, apparmor, admins, ssh, firewall.
# Phase 2b: nginx, php, mariadb, cache (redis|valkey), fail2ban, updates.
# Phase 4: isolation (tenant sandbox templates), cli (the `site` command).
- name: DomainPilot host baseline
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: preflight
      tags: [preflight, always]
    - role: base
      tags: [base]
    - role: sysctl
      tags: [sysctl]
    - role: apparmor
      tags: [apparmor]
    - role: admins
      tags: [admins, ssh]
    - role: ssh
      tags: [ssh]
    - role: firewall
      tags: [firewall]
    - role: nginx
      tags: [nginx, services]
    - role: php
      tags: [php, services]
    - role: mariadb
      tags: [mariadb, services]
    - role: cache
      tags: [cache, services]
    - role: fail2ban
      tags: [fail2ban, services]
    - role: updates
      tags: [updates]
    - role: isolation
      tags: [isolation]
    - role: cli
      tags: [cli]
