---
# ozenix host baseline.
# Phase 2a: preflight, base, sysctl, apparmor, admins, ssh, firewall.
# Phase 2b: nginx, php, mariadb, cache (redis|valkey), fail2ban, updates.
# Phase 6: acme (certbot, renewal timer, nginx deploy hook).
# Phase 4: isolation (tenant sandbox templates), cli (the `site` command).
# Phase 8: backup (restic, nightly + weekly drill), monitoring (self-check, alerts).
- name: Host baseline (ozenix)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: preflight
      tags: [preflight, always]
    - role: base
      tags: [base]
    - role: sysctl
      tags: [sysctl]
    - role: apparmor
      tags: [apparmor]
    - role: admins
      tags: [admins, ssh]
    - role: ssh
      tags: [ssh]
    - role: cloudflare
      tags: [cloudflare, firewall, nginx]
    - role: firewall
      tags: [firewall]
    - role: nginx
      tags: [nginx, services]
    - role: php
      tags: [php, services]
    - role: runtimes
      tags: [runtimes, services]
    - role: mariadb
      tags: [mariadb, services]
    - role: cache
      tags: [cache, services]
    - role: fail2ban
      tags: [fail2ban, services]
    - role: updates
      tags: [updates]
    - role: acme
      tags: [acme, ssl]
    - role: isolation
      tags: [isolation]
    - role: cli
      tags: [cli]
    - role: backup
      tags: [backup]
    - role: monitoring
      tags: [monitoring]
