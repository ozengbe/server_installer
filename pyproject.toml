[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "domainpilot"
description = "Ozenix Secure Server Management Platform"
requires-python = ">=3.12"
dynamic = ["version"]
# Runtime is deliberately stdlib-only: nothing from PyPI ever runs as root on servers.
dependencies = []

[project.optional-dependencies]
# Development tooling only. Never installed on servers.
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "mypy==1.13.0",
  "ruff==0.8.4",
]

[tool.setuptools.dynamic]
version = { attr = "domainpilot.__version__" }

[tool.setuptools.packages.find]
include = ["domainpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/security"]
addopts = "-ra --strict-markers"
pythonpath = ["tests", "tests/unit"]
markers = [
  "integration: needs a disposable Ubuntu 24.04 VM with root (never production)",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["domainpilot", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "PTH", "RUF"]
# N818: exception names are part of the documented API (OperationFailed, LockBusy, ...).
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, fixed system binaries, fake /tmp paths as payloads, seeded fuzzing.
"tests/**" = ["S101", "S105", "S106", "S603", "S108", "S311", "PTH"]
# core/ uses os-level calls deliberately: fd-based, O_NOFOLLOW and dir_fd
# semantics that pathlib does not expose.
"domainpilot/core/**" = ["PTH"]
# The mariadb CLI has no parameter binding; every identifier is validated
# (validate.tenant_id / db_name) and passwords are token_urlsafe before use.
"domainpilot/isolation/db.py" = ["S608"]
