#cloud-config
# Disposable ozenix test VM. NEVER use this on a production host.
package_update: true
packages:
  - python3-pytest
  - nftables
  - apparmor-utils
write_files:
  - path: /etc/ozenix-test-vm
    permissions: "0644"
    content: |
      This host is a disposable ozenix test VM. Destructive tests are allowed here.
