name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: pip install -e ".[dev]"
      - run: bash tools/check.sh

  integration:
    # GitHub-hosted runners are disposable Ubuntu 24.04 VMs with systemd and sudo.
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pytest nftables
      - run: echo "GitHub Actions runner (disposable)" | sudo tee /etc/domainpilot-test-vm
      - run: sudo python3 -m pytest -p no:cacheprovider -m integration tests/integration
