name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: pip install -e ".[dev]" "ansible-lint==24.12.2" "ansible-core>=2.16,<2.17"
      - run: bash tools/check.sh

  integration:
    # GitHub-hosted runners are disposable Ubuntu 24.04 VMs with systemd and sudo.
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable test host
        run: |
          echo "GitHub Actions runner (disposable)" | sudo tee /etc/domainpilot-test-vm
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pytest
          # The runner image ships MySQL, PHP (third-party PPA), nginx and Apache.
          # A real DomainPilot host starts clean; remove them so the test is representative.
          sudo systemctl stop mysql nginx apache2 2>/dev/null || true
          sudo apt-get purge -y -qq 'mysql-*' 'php*' 'nginx*' 'apache2*' 'libapache2-*' || true
          sudo rm -f /etc/apt/sources.list.d/*ondrej* /etc/apt/sources.list.d/*php*
          sudo rm -rf /etc/mysql /var/lib/mysql /etc/nginx /etc/php
          sudo apt-get update -qq
          mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
      - name: Install (first run)
        run: sudo installer/install.sh --yes -- -e dp_firewall_confirm_mode=immediate
      - name: Install (second run must change nothing)
        run: |
          sudo installer/install.sh --yes -- -e dp_firewall_confirm_mode=immediate | tee second-run.log
          grep -Eq 'localhost +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0' second-run.log
      - name: Integration tests
        run: sudo python3 -m pytest -p no:cacheprovider -m integration -v tests/integration
      - name: SSH login still works for the admin (key-only)
        run: ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i ~/.ssh/id_ed25519 "$USER@127.0.0.1" true
