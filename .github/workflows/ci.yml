name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: pip install -e ".[dev]" "ansible-lint==24.12.2" "ansible-core>=2.16,<2.17"
      - run: bash tools/ci/step.sh "checks" plain -- bash tools/check.sh
      # The release tooling must keep working: build an unsigned snapshot and
      # check that the tarball's manifest verifies (docs/release.md).
      - name: Release build (unsigned snapshot)
        run: |
          tools/ci/step.sh "release build" plain -- bash tools/release.sh --snapshot --out dist
          mkdir dist/x && tar -xzf dist/ozenix-*.tar.gz -C dist/x
          cd dist/x/ozenix-* && sha256sum --quiet --strict -c MANIFEST.sha256

  security:
    # Release gate: Bandit, Semgrep, pip-audit and Gitleaks. Any finding fails CI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Gitleaks scans the whole history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: bash tools/ci/step.sh "security scan" plain -- bash tools/security-scan.sh

  integration:
    # GitHub-hosted runners are disposable Ubuntu 24.04 VMs with systemd and sudo.
    # Failures are summarised as annotations on the run page (tools/ci/step.sh).
    needs: [checks, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare disposable test host
        run: |
          echo "GitHub Actions runner (disposable)" | sudo tee /etc/ozenix-test-vm
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pytest
          # The runner image ships MySQL, PHP (third-party PPA), nginx and Apache.
          # A real ozenix host starts clean; remove them so the test is representative.
          sudo systemctl stop mysql nginx apache2 2>/dev/null || true
          sudo apt-get purge -y -qq 'mysql-*' 'php*' 'nginx*' 'apache2*' 'libapache2-*' || true
          sudo rm -f /etc/apt/sources.list.d/*ondrej* /etc/apt/sources.list.d/*php*
          sudo rm -rf /etc/mysql /var/lib/mysql /etc/nginx /etc/php
          sudo apt-get update -qq
          mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys

      - name: Install (first run)
        id: install
        run: >-
          tools/ci/step.sh "install: first run" install --
          sudo installer/install.sh --yes -- -e dp_firewall_confirm_mode=immediate

      # The steps below still run if an earlier one fails, as long as the
      # install itself succeeded, so one run reports every problem at once.
      - name: Install (second run must change nothing)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          tools/ci/step.sh "install: second run not idempotent" idempotent --
          sudo installer/install.sh --yes -- -e dp_firewall_confirm_mode=immediate

      - name: Integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          tools/ci/step.sh "integration tests" pytest --
          sudo python3 -m pytest -p no:cacheprovider -m integration -v -rf --tb=short tests/integration

      - name: Diagnostics (only when something failed)
        if: ${{ failure() }}
        run: sudo tools/ci/diagnostics.sh

      - name: SSH login still works for the admin (key-only)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          tools/ci/step.sh "admin SSH login" plain --
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i ~/.ssh/id_ed25519
          "$USER@127.0.0.1" true
